<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sedona AI — Demo</title>
<meta name="description" content="Sedona AI product demo: business-card scanning, a voice agent, a partnership calendar, and a company CRM. Fictional data.">
<link rel="icon" href="assets/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body class="app-body">

<a href="#view-host" class="skip-link">Skip to content</a>

<!-- ===================== Header ===================== -->
<header class="app-header">
  <a class="brand" href="index.html" aria-label="Sedona AI home">
    <img src="assets/logo.svg" alt="" width="28" height="28">
    <span class="brand-word">Sedona<span class="brand-ai">AI</span></span>
  </a>

  <!-- Desktop: a live search field. Mobile: an icon that opens a sheet. -->
  <div class="header-search only-desk">
    <div class="search-input" id="header-search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
      <input type="search" id="search-field" placeholder="Search people, companies, meetings…" aria-label="Search everything" autocomplete="off">
      <span class="kbd-hint row" style="gap:3px"><kbd class="kbd">⌘</kbd><kbd class="kbd">K</kbd></span>
    </div>
  </div>

  <div class="header-actions">
    <button class="btn-icon only-mobile" id="mobile-search-btn" aria-label="Search">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
    </button>
    <button class="btn-icon" id="theme-btn" aria-label="Toggle dark mode" title="Toggle dark mode">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
    <span class="avatar avatar-t2 only-desk" title="Elena Ruiz — demo account">ER</span>
  </div>
</header>

<div class="app-frame">

  <!-- ===================== Sidebar (desktop) ===================== -->
  <nav class="sidebar only-desk" aria-label="Main">
    <p class="nav-heading">Capture</p>
    <a class="nav-link" href="#/scan" data-view="scan">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3"/><path d="M7 12h10"/></svg>
      <span>Scan a card</span>
    </a>
    <a class="nav-link" href="#/mycard" data-view="mycard">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="2"/><circle cx="8.5" cy="10.5" r="2"/><path d="M5 16a3.5 3.5 0 0 1 7 0M15 10h4M15 14h4"/></svg>
      <span>My card</span>
    </a>
    <a class="nav-link" href="#/voice" data-view="voice">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/></svg>
      <span>Voice agent</span>
    </a>

    <p class="nav-heading">Relationships</p>
    <a class="nav-link" href="#/calendar" data-view="calendar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      <span>Calendar</span>
    </a>
    <a class="nav-link" href="#/crm" data-view="crm">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21V8l6-4 6 4v13M15 21V11l6 4v6"/><path d="M7 12h2M7 16h2"/></svg>
      <span>Companies</span>
    </a>
    <a class="nav-link" href="#/contacts" data-view="contacts">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3 20a6 6 0 0 1 12 0M17 11a3 3 0 1 0-1.8-5.4M16 20a6 6 0 0 0-1.2-3.6"/></svg>
      <span>Contacts</span>
    </a>

    <p class="nav-heading">Agent</p>
    <div class="agent-feed" id="agent-feed" aria-label="Recent agent activity"></div>
  </nav>

  <!-- ===================== Views ===================== -->
  <main class="app-main" id="view-host">
    <section class="view" id="view-scan"     data-view="scan"     hidden></section>
    <section class="view" id="view-mycard"   data-view="mycard"   hidden></section>
    <section class="view" id="view-voice"    data-view="voice"    hidden></section>
    <section class="view" id="view-calendar" data-view="calendar" hidden></section>
    <section class="view" id="view-crm"      data-view="crm"      hidden></section>
    <section class="view" id="view-contacts" data-view="contacts" hidden></section>
  </main>
</div>

<!-- ===================== Bottom tab bar (mobile) ===================== -->
<nav class="tabbar only-mobile" aria-label="Main">
  <a class="tab" href="#/scan" data-view="scan">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3"/><path d="M7 12h10"/></svg>
    <span>Scan</span>
  </a>
  <a class="tab" href="#/voice" data-view="voice">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/></svg>
    <span>Voice</span>
  </a>
  <a class="tab" href="#/calendar" data-view="calendar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
    <span>Calendar</span>
  </a>
  <a class="tab" href="#/crm" data-view="crm">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21V8l6-4 6 4v13M15 21V11l6 4v6"/><path d="M7 12h2M7 16h2"/></svg>
    <span>CRM</span>
  </a>
  <button class="tab" id="tab-search" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
    <span>Search</span>
  </button>
</nav>

<!-- OCR runs entirely in the browser: Tesseract.js (Apache-2.0) for text,
     jsQR (Apache-2.0) for the QR/vCard fast path. No card image is uploaded.
     qrcode-generator (MIT) is the encoder for the card My card generates —
     jsQR only reads. -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>

<script src="js/ui.js"></script>
<script src="js/data.js"></script>
<script src="js/crm.js"></script>
<script src="js/calendar.js"></script>
<script src="js/ocr.js"></script>
<script src="js/stt.js"></script>
<script src="js/scan.js"></script>
<script src="js/mycard.js"></script>
<script src="js/voice.js"></script>
<script src="js/search.js"></script>
<script src="js/router.js"></script>
</body>
</html>
